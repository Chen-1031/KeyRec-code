[project]
name = "gemma4-video-eval"
version = "0.1.0"
description = "KeyRec: bounded visual memory for streaming and long-video understanding"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6.0",
    "transformers>=4.52.0",
    "accelerate>=1.0.0",
    "decord>=0.6.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.25.0",
    "rouge>=1.0.0",
    "vlmeval",
    "librosa>=0.11.0",
]

[tool.uv.sources]
vlmeval = { path = "third_party/VLMEvalKit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["gemma4_video_eval", "models", "benchmarks", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
