schema_version: 1

methods:
  - vanilla
  - keyrec

models:
  gemma4_e2b:
    label: Gemma 4 E2B
    family: gemma
    checkpoint: google/gemma-4-E2B-it
  gemma4_e4b:
    label: Gemma 4 E4B
    family: gemma
    checkpoint: google/gemma-4-E4B-it
  neo_ov_2b:
    label: NEO-ov 2B
    family: neo
    checkpoint: Paranioar/NEO1_5-2B-SFT

benchmarks:
  ovo_bench:
    label: OVO-Bench
    regime: streaming
    subsets: [Backward, Realtime]
  streamingbench:
    label: StreamingBench
    regime: streaming
    subsets: [Realtime]
  longvideobench:
    label: LongVideoBench
    regime: long_video
    subsets: [Validation]
  video_mme_v2:
    label: Video-MME v2
    regime: long_video
    subsets: [Overall]

event_update:
  merge_similarity: 0.75
  merge_max_gap_seconds: 2.0
  route_moving_average_weight: 0.2

profiles:
