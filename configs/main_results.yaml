    family: gemma
    regime: streaming
    sampled_frames: 32
    nominal_tokens_per_frame: 70
    chunk_size: 1
    top_m_novel_tokens: 16
    event_payload_tokens: 16
    event_capacity: 16
    recent_cache_tokens: 224
    readout_budget_tokens: 224
    temporal_coverage_weight: 0.2
    event_allocations:
      all_recent: 0
      heavy_recent: 2
      balanced: 4
      heavy_key_event: 12
      all_key_event: 14

  neo_streaming:
